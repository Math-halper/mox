name: Publish Mox

# Deploys the whole folder as a static site, so anyone can open Mox at
# https://<owner>.github.io/mox/ with nothing installed.
on:
  push:
    branches: [main, arena/09c15982-mox]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate the knowledge manifest
        run: python3 tools/build_knowledge_index.py

      - name: Verify the site
        run: python3 tools/check_site.py

      - name: Assemble the published folder
        run: |
          mkdir -p _site
          rsync -a --exclude '.git' --exclude '.github' --exclude '_site' ./ _site/
          touch _site/.nojekyll
          du -sh _site

      - uses: actions/configure-pages@v5
        with:
          # Turns on GitHub Pages for the repository on the first run.
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
